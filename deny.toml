# cargo deny check: known vulnerabilities, licences and banned crates in the
# dependency graph of the platforms the app ships on.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"

[bans]
# GPUI's graph holds several versions of many crates, which the app can't
# choose.
multiple-versions = "allow"
wildcards = "deny"
# the workspace's own crates, by path
allow-wildcard-paths = true
deny = [
    # TLS comes from rustls, as in rbw-ng
    { name = "openssl-sys" },
]

[licenses]
version = 2
# as packaging/licenses/about.toml, which lists them in the packages
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }
