<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
.stage{position:relative;padding:34px 16px 40px;border-radius:var(--radius,12px);display:flex;gap:18px;justify-content:safe center;align-items:flex-start;flex-wrap:wrap;overflow-x:auto}
.stage.nowrap{flex-wrap:nowrap}
.wp-light{background:radial-gradient(60% 80% at 12% 18%,#9ccaff 0,transparent 62%),radial-gradient(50% 70% at 88% 12%,#d9b9ff 0,transparent 60%),radial-gradient(60% 80% at 72% 98%,#ffc7a6 0,transparent 60%),radial-gradient(50% 60% at 18% 98%,#a6ecd8 0,transparent 60%),#e6edfb}
.wp-dark{background:radial-gradient(60% 80% at 12% 18%,#1f3f8f 0,transparent 62%),radial-gradient(50% 70% at 88% 12%,#5a2f8c 0,transparent 60%),radial-gradient(60% 80% at 72% 98%,#8a3b3f 0,transparent 60%),radial-gradient(50% 60% at 18% 98%,#0f5560 0,transparent 60%),#0c1024}
.t-light{--bg:#fff;--card:#f3f3f6;--line:rgba(0,0,0,.08);--text:#1d1d1f;--dim:#6e6e73;--faint:#a9a9af;--accent:#007aff;--fill:rgba(0,0,0,.055);
  --side:linear-gradient(180deg,#ebecf0,#efebea);--sel:rgba(0,0,0,.09);--ctl:rgba(255,255,255,.86);--edge:rgba(255,255,255,.9);--hi:rgba(255,255,255,1);
  --frost:rgba(248,248,252,.6);--inner:rgba(255,255,255,.62);--seg:#fff;--ok:#34c759;--sym:#e8590c;--shadow:rgba(30,40,80,.34);--field:#fff}
.t-dark{--bg:#1c1c1e;--card:#2a2a2e;--line:rgba(255,255,255,.09);--text:#f5f5f7;--dim:#a1a1a8;--faint:#6b6b72;--accent:#0a84ff;--fill:rgba(255,255,255,.09);
  --side:linear-gradient(180deg,#2a2b31,#2d2a2b);--sel:rgba(255,255,255,.12);--ctl:rgba(72,72,78,.9);--edge:rgba(255,255,255,.13);--hi:rgba(255,255,255,.16);
  --frost:rgba(34,34,40,.62);--inner:rgba(255,255,255,.07);--seg:#5b5b62;--ok:#30d158;--sym:#ff9f0a;--shadow:rgba(0,0,0,.65);--field:#1c1c1e}
.win{position:relative;flex:none;color:var(--text);border-radius:18px;overflow:hidden;text-align:left;
  box-shadow:0 34px 60px -22px var(--shadow),0 0 0 .5px rgba(0,0,0,.22);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",var(--font-sans,system-ui),sans-serif;-webkit-font-smoothing:antialiased}
.win svg.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.grow{flex:1;min-width:0}.dim{color:var(--dim)}.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:"SF Mono",var(--font-mono,ui-monospace),monospace}
.lights{display:flex;gap:9px}.lights i{width:14px;height:14px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tile{width:32px;height:32px;border-radius:28%;display:grid;place-items:center;flex:none;color:#fff;font-weight:600;font-size:14px;
  background:linear-gradient(160deg,hsl(var(--h) 78% 64%),hsl(var(--h) 72% 48%));box-shadow:inset 0 .5px 0 rgba(255,255,255,.45)}
.tile.lg{width:56px;height:56px;font-size:25px}.tile.sm{width:28px;height:28px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--ctl);border:.5px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),0 1px 5px rgba(0,0,0,.11),0 0 0 .5px rgba(0,0,0,.05);white-space:nowrap;font-weight:500}
.pill.round{width:30px;padding:0}.pill.acc{background:var(--accent);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 8px rgba(0,122,255,.35)}
.pill.search{justify-content:flex-start;color:var(--dim);font-weight:400}
.card{background:var(--card);border-radius:13px}
.cr{display:flex;align-items:center;gap:10px;padding:9px 13px;position:relative;min-height:40px}
.cr+.cr:before{content:"";position:absolute;left:13px;right:0;top:0;border-top:.5px solid var(--line)}
.cr .l{display:block;font-size:11.5px;color:var(--dim);margin-bottom:1px}
.cr .ic{color:var(--faint)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg span{flex:1;text-align:center;padding:4.5px 0;border-radius:7px;font-size:12.5px;color:var(--text)}
.seg .on{background:var(--seg);box-shadow:0 1px 3px rgba(0,0,0,.16);font-weight:600}
.sw{width:36px;height:21px;border-radius:99px;background:var(--ok);position:relative;flex:none}.sw:after{content:"";position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.off{background:var(--fill)}.sw.off:after{right:auto;left:2px}
.track{flex:1;height:4px;border-radius:2px;background:var(--fill);position:relative}.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.track b{position:absolute;top:-8px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
.pw i{font-style:normal;color:var(--accent)}.pw u{text-decoration:none;color:var(--sym)}
.ring{width:16px;height:16px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:2.4}.ring .t{stroke:var(--fill)}.ring .p{stroke:var(--accent);stroke-linecap:round}

/* vault window */
.vault{width:680px;height:470px;display:grid;grid-template-columns:180px 210px minmax(0,1fr);background:var(--bg)}
/* the sidebar: flush with the window's edges, on the system's sidebar material, a
   hairline and a soft shade towards the content */
.side{background:var(--side);border-right:.5px solid var(--line);box-shadow:inset -8px 0 8px -8px rgba(0,0,0,.1);display:flex;flex-direction:column;padding:0 10px 7px;min-height:0}
.side .top{height:50px;display:flex;align-items:center;margin:0 -10px;padding:0 0 0 19px}
.nav{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:8px}
.nav .ic{color:var(--accent);width:16px!important;height:16px!important}
.nav.on{background:var(--sel);font-weight:700}
.lab{font-size:11px;font-weight:600;color:var(--dim);padding:13px 8px 4px}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:10px}
.ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;background:linear-gradient(160deg,#8e9bff,#5b6cf0);flex:none}
.list{border-right:.5px solid var(--line);min-height:0;overflow:hidden}
.bar{height:50px;display:flex;align-items:center;gap:8px;padding:0 12px}
.li{display:flex;align-items:center;gap:10px;padding:6px 9px;margin:0 7px 1px;border-radius:10px}
.li .n{font-weight:500}.li .u{font-size:12px;color:var(--dim)}
.li.on{background:var(--accent);color:#fff}.li.on .u{color:rgba(255,255,255,.82)}
.det{min-width:0;overflow:hidden;display:flex;flex-direction:column}
.det .body{padding:2px 16px 16px}
.ok{color:var(--ok)!important}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:350px;border-radius:18px;padding:16px;background:var(--frost);backdrop-filter:blur(30px) saturate(1.6);border:.5px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -10px rgba(0,0,0,.6)}
.sheet .card{background:var(--inner)}
.fr{display:flex;align-items:center;gap:10px;padding:0 13px;min-height:38px;position:relative}
.fr+.fr:before{content:"";position:absolute;left:13px;right:0;top:0;border-top:.5px solid var(--line)}
.fr .l{width:76px;color:var(--dim);flex:none}
.caret{display:inline-block;width:1.5px;height:1.1em;background:var(--accent);vertical-align:-.18em;margin-left:1px}

/* menu bar */
.mbar{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:flex-end;gap:15px;padding:0 14px;font:500 12px -apple-system,"Inter",var(--font-sans,system-ui),sans-serif;color:#1d1d1f;background:rgba(255,255,255,.3);backdrop-filter:blur(20px)}
.mbar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mbar .me-on{background:rgba(0,0,0,.12);border-radius:5px;padding:2px 7px;display:inline-flex}
.pop{width:306px;max-width:100%;padding:12px;background:var(--frost);backdrop-filter:blur(34px) saturate(1.8);border:.5px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 24px 50px -14px var(--shadow),0 0 0 .5px rgba(0,0,0,.12)}
.pop .card{background:var(--inner)}
.pop .li{margin:0;padding:6px 7px}
.pop .li.hov{background:var(--fill)}
.plab{font-size:11.5px;font-weight:600;color:var(--dim);padding:12px 7px 5px}

/* lock */
.lock{width:470px;max-width:100%;height:340px;background:var(--frost);backdrop-filter:blur(40px) saturate(1.8);border:.5px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lock .lights{position:absolute;left:19px;top:18px}
.appic{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#5aa9ff,#0a63e0);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -6px rgba(0,90,220,.55)}
.appic svg.ic{width:28px!important;height:28px!important;stroke-width:1.3!important}

/* GNOME / libadwaita variant */
.adw{--bg:#fafafb;--card:#fff;--line:rgba(0,0,0,.1);--text:#1e1e20;--dim:#5e5c64;--faint:#9a9996;--accent:#3584e4;--fill:rgba(0,0,0,.07);--ctl:rgba(0,0,0,.06);--ok:#26a269;--sym:#c64600;--shadow:rgba(0,0,0,.4);--seg:#fff;
  border-radius:12px;font-family:"Adwaita Sans","Inter","Cantarell",var(--font-sans,system-ui),sans-serif}
.adw .side{box-shadow:none;background:#ebebed;border-right:1px solid var(--line);padding:0 6px 6px}
.adw .side .top{justify-content:center;font-weight:700;height:46px;margin:0;padding:0}
.adw .nav .ic{color:var(--text)}.adw .nav{border-radius:6px;height:32px}.adw .nav.on{background:var(--fill);font-weight:600}
.adw .pill{box-shadow:none;border:0;border-radius:8px;height:32px;background:var(--ctl)}.adw .pill.flat{background:none}
.adw .bar{height:46px}
.adw .li{border-radius:8px}.adw .li.on{background:var(--fill);color:var(--text)}.adw .li.on .u{color:var(--dim)}
.adw .tile{border-radius:22%}
.adw .card{border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.adw .list{border-right:1px solid var(--line);background:#fff}
.adw .ava{background:#9141ac}
.adw .wc{width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.adw .wc svg.ic{width:11px!important;height:11px!important;stroke-width:1.8!important}
</style>

<symbol id="i-grid" viewBox="0 0 16 16"><rect x="2.500" y="2.500" width="4.500" height="4.500" rx="1"/><rect x="9" y="2.500" width="4.500" height="4.500" rx="1"/><rect x="2.500" y="9" width="4.500" height="4.500" rx="1"/><rect x="9" y="9" width="4.500" height="4.500" rx="1"/></symbol>

<div class="stage wp-light"><div class="win lock t-light">
  <span class="lights"><i></i><i></i><i></i></span>
  <span class="appic"><svg class="ic" ><use href="#i-lock"/></svg></span>
  <div style="font-size:20px;font-weight:700;margin-top:16px;letter-spacing:-.01em">Welcome back</div>
  <div class="dim" style="margin-top:3px">alex@example.org</div>
  <div class="pill" style="width:270px;height:38px;margin-top:20px;padding:0 5px 0 16px;justify-content:flex-start;background:var(--field)">
    <span class="grow dim" style="text-align:left;font-weight:400">Master password</span>
    <span class="pill round acc" style="width:28px;height:28px"><svg class="ic" ><use href="#i-arrow"/></svg></span>
  </div>
  <div style="display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--accent);font-weight:500"><svg class="ic" ><use href="#i-finger"/></svg>Unlock with Touch ID</div>
</div></div>
